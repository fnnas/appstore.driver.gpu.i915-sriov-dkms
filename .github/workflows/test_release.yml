name: Test Release
run-name: ${{ github.actor }} build ${{ github.ref_name }} ${{ github.sha }}

permissions:
  contents: write
  actions: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
    inputs:
      make_release:
        description: '是否创建 GitHub Release？'
        required: true
        type: boolean
        default: false
      enable_ccache:
        description: '是否启用 ccache 编译缓存？'
        required: true
        type: boolean
        default: true

env:
  proj_name: "i915-sriov-dkms"
  target_dkms_version: "2026.05.06"
  target_commit_sha: "d146e98a" #2026.05.06
  linux_firmware_commit_sha: "a3d046ca8eee45ff2d2eda129b495c686dd78040" #i915: Xe3LPD DMC v2.34
  this_pack_manifest_version: "1.0.12"
jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      proj_name: ${{ env.proj_name }}
      target_commit_sha: ${{ env.target_commit_sha }}
      target_dkms_version: ${{ env.target_dkms_version }}
      linux_firmware_commit_sha: ${{ env.linux_firmware_commit_sha }}
    steps:
      - run: echo "All set!"
  get_firmware:
    uses: ./.github/workflows/get_firmware.yml
    secrets: inherit
    needs:
      - setup
    with:
      proj_name: ${{ needs.setup.outputs.proj_name }}
      linux_firmware_commit_sha: ${{ needs.setup.outputs.linux_firmware_commit_sha }}
  build_kernel:
    uses: ./.github/workflows/kernel-build.yml
    secrets: inherit
    needs:
      - setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - kernel_name: "6.6.38-trim_92"
            kernel_ver: "6.6.38-trim"
            container_image: "makedie/fnos:kernHead-6.6.38-trim-92"
            target_commit_sha: "e26ce8952e465762fc0743731aa377ec0b2889ff"
            target_dkms_version: "2024.09.21"
            patch_mode: "legacy_6_6_38"
          - kernel_name: "6.12.5-trim_10"
            kernel_ver: "6.12.5-trim"
            container_image: "makedie/fnos:kernHead-6.12.5-trim-10"
            target_commit_sha: "d1a9f212a2f517bdffe4a850f5cbdd0930be17a8"
            target_dkms_version: "2026.03.05"
            patch_mode: ""
          - kernel_name: "6.12.18-trim_3"
            kernel_ver: "6.12.18-trim"
            container_image: "makedie/fnos:kernHead-6.12.18-trim-3"
            target_commit_sha: "d1a9f212a2f517bdffe4a850f5cbdd0930be17a8"
            target_dkms_version: "2026.03.05"
            patch_mode: ""
          - kernel_name: "6.18.6-trim-297-amd64"
            kernel_ver: "6.18.6-trim"
            container_image: "makedie/fnos:kernHead-6.18.6-trim-297-amd64"
            target_commit_sha: ${{ needs.setup.outputs.target_commit_sha }}
            target_dkms_version: ${{ needs.setup.outputs.target_dkms_version }}
            patch_mode: ""
          - kernel_name: "6.18.18-trim-427-amd64"
            kernel_ver: "6.18.18-trim"
            container_image: "makedie/fnos:kernHead-6.18.18-trim-427-amd64"
            target_commit_sha: ${{ needs.setup.outputs.target_commit_sha }}
            target_dkms_version: ${{ needs.setup.outputs.target_dkms_version }}
            patch_mode: ""
          - kernel_name: "6.18.18-trim-570-amd64"
            kernel_ver: "6.18.18-trim"
            container_image: "makedie/fnos:kernHead-6.18.18-trim-570-amd64"
            target_commit_sha: ${{ needs.setup.outputs.target_commit_sha }}
            target_dkms_version: ${{ needs.setup.outputs.target_dkms_version }}
            patch_mode: ""
          - kernel_name: "6.18.18-trim-587-amd64"
            kernel_ver: "6.18.18-trim"
            container_image: "makedie/fnos:kernHead-6.18.18-trim-587-amd64"
            target_commit_sha: ${{ needs.setup.outputs.target_commit_sha }}
            target_dkms_version: ${{ needs.setup.outputs.target_dkms_version }}
            patch_mode: ""
    with:
      proj_name: ${{ needs.setup.outputs.proj_name }}
      target_commit_sha: ${{ matrix.target_commit_sha }}
      target_dkms_version: ${{ matrix.target_dkms_version }}
      kernel_name: ${{ matrix.kernel_name }}
      kernel_ver: ${{ matrix.kernel_ver }}
      container_image: ${{ matrix.container_image }}
      patch_mode: ${{ matrix.patch_mode }}
      enable_ccache: ${{ inputs.enable_ccache }}

  prune_ccache:
    if: ${{ always() && inputs.enable_ccache }}
    needs:
      - build_kernel
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep latest two ccache entries per kernel
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          cache_ids="$(gh cache list --key ccache- --limit 1000 --json id,key,createdAt --jq '
            map(select(.key | test("^ccache-.+-[0-9]+-[0-9]+$")))
            | group_by(.key | sub("-[0-9]+-[0-9]+$"; ""))
            | map(sort_by(.createdAt) | reverse | .[2:][]?)
            | .[].id
          ')"

          if [ -z "$cache_ids" ]; then
            echo "No old ccache entries to delete."
            exit 0
          fi

          while IFS= read -r cache_id; do
            [ -n "$cache_id" ] || continue
            echo "Deleting old ccache entry: $cache_id"
            gh cache delete "$cache_id" || true
          done <<< "$cache_ids"

  pack_app_tgz:
    needs:
      - get_firmware
      - build_kernel
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
      - name: restore firmware
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.proj_name }}-${{ env.linux_firmware_commit_sha }}-firmware
          path: app/app/firmware
      - name: restore kernel artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: ${{ env.proj_name }}-6*
          path: app/app/
          merge-multiple: true

      - name: Replace manifest build-time values
        run: |
          sed -i \
            -e "s|this_pack_manifest_version|${{ env.this_pack_manifest_version }}|g" \
            i915-sriov-dkms_driver/manifest

      - name: 打包app.tgz
        run: |
          cd app/
          tar zcvf app.tgz app ui
          mv app.tgz ../i915-sriov-dkms_driver/
      - name: 打包package
        run: |
          tar zcvf appstore.driver.gpu.i915-sriov-dkms-${{ env.this_pack_manifest_version }}-${{ env.target_commit_sha }}.tgz i915-sriov-dkms_driver
      - name: 上传应用包
        uses: actions/upload-artifact@v6
        with:
          name: appstore.driver.gpu.i915-sriov-dkms-${{ env.this_pack_manifest_version }}-${{ env.target_commit_sha }}.tgz
          path: appstore.driver.gpu.i915-sriov-dkms-${{ env.this_pack_manifest_version }}-${{ env.target_commit_sha }}.tgz
      - name: Create GitHub Release
        if: ${{ inputs.make_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ env.this_pack_manifest_version }}" \
            --title "fnnas.appstore.driver.gpu.i915-sriov-dkms-${{ env.this_pack_manifest_version }}-${{ env.target_commit_sha }}" \
            --prerelease \
            --notes "Automated prerelease build."

      - name: Upload Release Assets
        if: ${{ inputs.make_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Uploading release assets..."

          echo "Uploading appstore.driver.gpu.i915-sriov-dkms-${{ env.this_pack_manifest_version }}-${{ env.target_commit_sha }}.tgz"
          gh release upload "${{ env.this_pack_manifest_version }}" "appstore.driver.gpu.i915-sriov-dkms-${{ env.this_pack_manifest_version }}-${{ env.target_commit_sha }}.tgz" || echo "Failed to upload appstore.driver.gpu.i915-sriov-dkms-${{ env.this_pack_manifest_version }}-${{ env.target_commit_sha }}.tgz"

          echo "Upload completed!"

      - name: Verify Uploaded Assets
        if: ${{ inputs.make_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Uploaded assets:"
          gh release view "${{ env.this_pack_manifest_version }}" --json assets -q '.assets[].name'
