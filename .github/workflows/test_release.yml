name: Test Release
run-name: ${{ github.actor }} build ${{ github.ref_name }} ${{ github.sha }}

permissions:
  contents: write
  actions: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
    inputs:
      make_release:
        description: '是否创建 GitHub Release？ / Create a GitHub Release?'
        required: true
        type: boolean
        default: false
      enable_ccache:
        description: '是否启用 ccache 编译缓存？ / Enable ccache?'
        required: true
        type: boolean
        default: true
      build_old_kernels:
        description: '是否构建已放弃支持的旧内核模块？ / Build unsupported old kernels?'
        required: true
        type: boolean
        default: false

env:
  proj_name: "i915-sriov-dkms"
  target_dkms_version: "2026.09.16"
  target_commit_sha: "4fdc4434" #2026.09.16
  linux_firmware_commit_sha: "830ba56b93d3e6cca6ead64924337b409b29b1e4" #i915: Xe3LPD DMC v2.36
  this_pack_manifest_version: "1.0.25"
jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      proj_name: ${{ env.proj_name }}
      target_commit_sha: ${{ env.target_commit_sha }}
      target_dkms_version: ${{ env.target_dkms_version }}
      linux_firmware_commit_sha: ${{ env.linux_firmware_commit_sha }}
    steps:
      - run: echo "All set!"
  get_firmware:
    uses: ./.github/workflows/get_firmware.yml
    secrets: inherit
    needs:
      - setup
    with:
      proj_name: ${{ needs.setup.outputs.proj_name }}
      linux_firmware_commit_sha: ${{ needs.setup.outputs.linux_firmware_commit_sha }}
  build_old_kernels:
    name: Old kernels (unsupported)
    if: ${{ inputs.build_old_kernels }}
    uses: ./.github/workflows/kernel-build.yml
    secrets: inherit
    needs:
      - setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - kernel_name: "6.6.38-trim_92"
            kernel_ver: "6.6.38-trim"
            container_image: "makedie/fnos:kernHead-6.6.38-trim-92"
            target_commit_sha: "e26ce8952e465762fc0743731aa377ec0b2889ff"
            target_dkms_version: "2024.09.21"
            patch_mode: "legacy_6_6_38"
          - kernel_name: "6.12.5-trim_10"
            kernel_ver: "6.12.5-trim"
            container_image: "makedie/fnos:kernHead-6.12.5-trim-10"
            target_commit_sha: "d1a9f212a2f517bdffe4a850f5cbdd0930be17a8"
            target_dkms_version: "2026.03.05"
            patch_mode: ""
          - kernel_name: "6.12.18-trim_3"
            kernel_ver: "6.12.18-trim"
            container_image: "makedie/fnos:kernHead-6.12.18-trim-3"
            target_commit_sha: "d1a9f212a2f517bdffe4a850f5cbdd0930be17a8"
            target_dkms_version: "2026.03.05"
            patch_mode: ""
          - kernel_name: "6.18.6-trim-297-amd64"
            kernel_ver: "6.18.6-trim"
            container_image: "makedie/fnos:kernHead-6.18.6-trim-297-amd64"
            target_commit_sha: ${{ needs.setup.outputs.target_commit_sha }}
            target_dkms_version: ${{ needs.setup.outputs.target_dkms_version }}
            patch_mode: ""
          - kernel_name: "6.18.18-trim-427-amd64"
            kernel_ver: "6.18.18-trim"
            container_image: "makedie/fnos:kernHead-6.18.18-trim-427-amd64"
            target_commit_sha: ${{ needs.setup.outputs.target_commit_sha }}
            target_dkms_version: ${{ needs.setup.outputs.target_dkms_version }}
            patch_mode: ""
          - kernel_name: "6.18.18-trim-570-amd64"
            kernel_ver: "6.18.18-trim"
            container_image: "makedie/fnos:kernHead-6.18.18-trim-570-amd64"
            target_commit_sha: ${{ needs.setup.outputs.target_commit_sha }}
            target_dkms_version: ${{ needs.setup.outputs.target_dkms_version }}
            patch_mode: ""
          - kernel_name: "6.18.18-trim-587-amd64"
            kernel_ver: "6.18.18-trim"
            container_image: "makedie/fnos:kernHead-6.18.18-trim-587-amd64"
            target_commit_sha: ${{ needs.setup.outputs.target_commit_sha }}
            target_dkms_version: ${{ needs.setup.outputs.target_dkms_version }}
            patch_mode: ""
          - kernel_name: "6.18.18-trim-717-amd64"
            kernel_ver: "6.18.18-trim"
            container_image: "makedie/fnos:kernHead-6.18.18-trim-717-amd64"
            target_commit_sha: ${{ needs.setup.outputs.target_commit_sha }}
            target_dkms_version: ${{ needs.setup.outputs.target_dkms_version }}
            patch_mode: ""
    with:
      proj_name: ${{ needs.setup.outputs.proj_name }}
      target_commit_sha: ${{ matrix.target_commit_sha }}
      target_dkms_version: ${{ matrix.target_dkms_version }}
      kernel_name: ${{ matrix.kernel_name }}
      kernel_ver: ${{ matrix.kernel_ver }}
      container_image: ${{ matrix.container_image }}
      patch_mode: ${{ matrix.patch_mode }}
      enable_ccache: ${{ inputs.enable_ccache }}

  build_kernel:
    uses: ./.github/workflows/kernel-build.yml
    secrets: inherit
    needs:
      - setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - kernel_name: "6.18.18.c788-trim-amd64"
            kernel_ver: "6.18.18.c788-trim"
            container_image: "makedie/fnos:kernHead-6.18.18.c788-trim-amd64"
            target_commit_sha: ${{ needs.setup.outputs.target_commit_sha }}
            target_dkms_version: ${{ needs.setup.outputs.target_dkms_version }}
            patch_mode: ""
          - kernel_name: "6.18.18.c877-trim-amd64"
            kernel_ver: "6.18.18.c877-trim"
            container_image: "makedie/fnos:kernHead-6.18.18.c877-trim-amd64"
            target_commit_sha: ${{ needs.setup.outputs.target_commit_sha }}
            target_dkms_version: ${{ needs.setup.outputs.target_dkms_version }}
            patch_mode: ""
          - kernel_name: "6.18.18.c938-trim-amd64"
            kernel_ver: "6.18.18.c938-trim"
            container_image: "makedie/fnos:kernHead-6.18.18.c938-trim-amd64"
            target_commit_sha: ${{ needs.setup.outputs.target_commit_sha }}
            target_dkms_version: ${{ needs.setup.outputs.target_dkms_version }}
            patch_mode: ""
          - kernel_name: "6.18.18.c952-trim-amd64"
            kernel_ver: "6.18.18.c952-trim"
            container_image: "makedie/fnos:kernHead-6.18.18.c952-trim-amd64"
            target_commit_sha: ${{ needs.setup.outputs.target_commit_sha }}
            target_dkms_version: ${{ needs.setup.outputs.target_dkms_version }}
            patch_mode: ""
          - kernel_name: "6.18.18.c1032-trim-amd64"
            kernel_ver: "6.18.18.c1032-trim"
            container_image: "makedie/fnos:kernHead-6.18.18.c1032-trim-amd64"
            target_commit_sha: ${{ needs.setup.outputs.target_commit_sha }}
            target_dkms_version: ${{ needs.setup.outputs.target_dkms_version }}
            patch_mode: ""
          - kernel_name: "6.18.18.c1078-trim-amd64"
            kernel_ver: "6.18.18.c1078-trim"
            container_image: "makedie/fnos:kernHead-6.18.18.c1078-trim-amd64"
            target_commit_sha: ${{ needs.setup.outputs.target_commit_sha }}
            target_dkms_version: ${{ needs.setup.outputs.target_dkms_version }}
            patch_mode: ""
          - kernel_name: "6.18.18.c1126-trim-amd64"
            kernel_ver: "6.18.18.c1126-trim"
            container_image: "makedie/fnos:kernHead-6.18.18.c1126-trim-amd64"
            target_commit_sha: ${{ needs.setup.outputs.target_commit_sha }}
            target_dkms_version: ${{ needs.setup.outputs.target_dkms_version }}
            patch_mode: ""
          - kernel_name: "6.18.18.c1168-trim-amd64"
            kernel_ver: "6.18.18.c1168-trim"
            container_image: "makedie/fnos:kernHead-6.18.18.c1168-trim-amd64"
            target_commit_sha: ${{ needs.setup.outputs.target_commit_sha }}
            target_dkms_version: ${{ needs.setup.outputs.target_dkms_version }}
            patch_mode: ""
    with:
      proj_name: ${{ needs.setup.outputs.proj_name }}
      target_commit_sha: ${{ matrix.target_commit_sha }}
      target_dkms_version: ${{ matrix.target_dkms_version }}
      kernel_name: ${{ matrix.kernel_name }}
      kernel_ver: ${{ matrix.kernel_ver }}
      container_image: ${{ matrix.container_image }}
      patch_mode: ${{ matrix.patch_mode }}
      enable_ccache: ${{ inputs.enable_ccache }}

  prune_ccache:
    if: ${{ always() && inputs.enable_ccache }}
    needs:
      - build_old_kernels
      - build_kernel
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep latest two ccache entries per kernel
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "Repository: $GH_REPO"
          echo "Authenticated as: $(gh api user --jq .login 2>/dev/null || echo unknown)"
          echo "Listing ccache entries..."

          caches_file="$(mktemp)"
          delete_file="$(mktemp)"

          gh cache list --key ccache- --limit 1000 --json id,key,createdAt,lastAccessedAt,sizeInBytes > "$caches_file"

          cache_count="$(jq 'length' "$caches_file")"
          echo "Found $cache_count cache entries with ccache- prefix."
          jq -r '
            sort_by(.key)
            | .[]
            | "- id=\(.id) key=\(.key) createdAt=\(.createdAt) lastAccessedAt=\(.lastAccessedAt) size=\(.sizeInBytes)"
          ' "$caches_file"

          jq -c '
            map(select(.key | test("^ccache-.+-[0-9]+-[0-9]+$")))
            | group_by(.key | sub("-[0-9]+-[0-9]+$"; ""))
            | map(sort_by(.createdAt) | reverse | .[2:][]?)
            | .[]
          ' "$caches_file" > "$delete_file"

          delete_count="$(jq -s 'length' "$delete_file")"
          if [ "$delete_count" -eq 0 ]; then
            echo "No old ccache entries to delete."
            exit 0
          fi

          echo "Deleting $delete_count old ccache entries. Keeping latest two entries per kernel key prefix."
          jq -r '
            "- id=\(.id) key=\(.key) createdAt=\(.createdAt) lastAccessedAt=\(.lastAccessedAt) size=\(.sizeInBytes)"
          ' "$delete_file"

          while IFS= read -r cache; do
            [ -n "$cache" ] || continue
            cache_id="$(jq -r '.id' <<< "$cache")"
            cache_key="$(jq -r '.key' <<< "$cache")"
            cache_created_at="$(jq -r '.createdAt' <<< "$cache")"
            echo "::group::Delete cache id=$cache_id key=$cache_key"
            echo "createdAt=$cache_created_at"
            if output="$(gh cache delete "$cache_id" 2>&1)"; then
              echo "Deleted cache id=$cache_id key=$cache_key"
            else
              status="$?"
              echo "::warning::Failed to delete cache id=$cache_id key=$cache_key exit=$status"
              echo "$output"
            fi
            echo "::endgroup::"
          done < "$delete_file"

  pack_app_tgz:
    if: ${{ always() && needs.get_firmware.result == 'success' && needs.build_kernel.result == 'success' && (!inputs.build_old_kernels || needs.build_old_kernels.result == 'success') }}
    needs:
      - get_firmware
      - build_old_kernels
      - build_kernel
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
      - name: restore firmware
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.proj_name }}-${{ env.linux_firmware_commit_sha }}-firmware
          path: app/app/firmware
      - name: restore kernel artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: ${{ env.proj_name }}-6*
          path: app/app/
          merge-multiple: true

      - name: Stage driver source for optional local builds
        shell: bash
        run: |
          set -euo pipefail
          source_checkout="$(mktemp -d)"
          trap 'rm -rf -- "$source_checkout"' EXIT

          git clone --quiet --filter=blob:none --no-checkout \
            https://github.com/GreenDamTan/i915-sriov-dkms.git "$source_checkout"
          mkdir -p app/app/i915-sriov-dkms-source
          git -C "$source_checkout" archive --format=tar "${{ env.target_commit_sha }}" | \
            tar -x -C app/app/i915-sriov-dkms-source
          printf '%s\n' "${{ env.target_commit_sha }}" > app/app/i915-sriov-dkms-source/VERSION

      - name: Replace manifest and translation build-time values
        run: |
          sed -i \
            -e "s|this_pack_manifest_version|${{ env.this_pack_manifest_version }}|g" \
            -e "s|target_dkms_version|${{ env.target_dkms_version }}|g" \
            i915-sriov-dkms_driver/manifest \
            i915-sriov-dkms_driver/i18n/zh \
            i915-sriov-dkms_driver/i18n/en

      - name: Stage runtime translations
        run: |
          mkdir -p app/app/i18n
          cp i915-sriov-dkms_driver/i18n/zh i915-sriov-dkms_driver/i18n/en app/app/i18n/

      - name: Pack app.tgz
        run: |
          cd app/
          tar zcvf app.tgz app ui
          mv app.tgz ../i915-sriov-dkms_driver/
      - name: Pack application
        run: |
          tar zcvf appstore.driver.gpu.i915-sriov-dkms-${{ env.this_pack_manifest_version }}-${{ env.target_commit_sha }}.tgz i915-sriov-dkms_driver
      - name: Rename package extension
        run: |
          mv appstore.driver.gpu.i915-sriov-dkms-${{ env.this_pack_manifest_version }}-${{ env.target_commit_sha }}.tgz appstore.driver.gpu.i915-sriov-dkms-${{ env.this_pack_manifest_version }}-${{ env.target_commit_sha }}.tgz.fpk
      - name: Upload application package
        uses: actions/upload-artifact@v6
        with:
          name: appstore.driver.gpu.i915-sriov-dkms-${{ env.this_pack_manifest_version }}-${{ env.target_commit_sha }}.tgz.fpk
          path: appstore.driver.gpu.i915-sriov-dkms-${{ env.this_pack_manifest_version }}-${{ env.target_commit_sha }}.tgz.fpk
      - name: Create GitHub Release
        if: ${{ inputs.make_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## 构建选项 / Build options"
            echo
            echo "- make_release: ${{ inputs.make_release }}"
            echo "- enable_ccache: ${{ inputs.enable_ccache }}"
            echo "- build_old_kernels (旧内核，已放弃支持 / unsupported old kernels): ${{ inputs.build_old_kernels }}"
            echo
            echo "## 最新提交 / Latest commit"
            echo
            git log -1 --pretty=%B
          } > release_notes.md
          gh release create "${{ env.this_pack_manifest_version }}" \
            --title "i915-sriov-dkms-${{ env.this_pack_manifest_version }}-${{ env.target_commit_sha }}" \
            --prerelease \
            --notes-file release_notes.md

      - name: Upload Release Assets
        if: ${{ inputs.make_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Uploading release assets..."

          echo "Uploading appstore.driver.gpu.i915-sriov-dkms-${{ env.this_pack_manifest_version }}-${{ env.target_commit_sha }}.tgz.fpk"
          gh release upload "${{ env.this_pack_manifest_version }}" "appstore.driver.gpu.i915-sriov-dkms-${{ env.this_pack_manifest_version }}-${{ env.target_commit_sha }}.tgz.fpk" || echo "Failed to upload appstore.driver.gpu.i915-sriov-dkms-${{ env.this_pack_manifest_version }}-${{ env.target_commit_sha }}.tgz.fpk"

          echo "Upload completed!"

      - name: Verify Uploaded Assets
        if: ${{ inputs.make_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Uploaded assets:"
          gh release view "${{ env.this_pack_manifest_version }}" --json assets -q '.assets[].name'
