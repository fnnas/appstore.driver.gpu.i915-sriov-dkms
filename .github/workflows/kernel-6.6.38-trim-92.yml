name: kernel-6.6.38-trim-92.yml
permissions:
  contents: write  # Allow writing to repository contents (for pushing tags)
  actions: write   # Allows triggering actions
on:
  workflow_call: # This allows this workflow to be called from another workflow
    inputs:
      proj_name:
        required: true
        type: string
        default: "i915-sriov-dkms"
      target_commit_sha:
        required: true
        type: string
        default: "HEAD"
      target_dkms_version:
        required: true
        type: string
        default: ""
jobs:
  build_6-6-38-trim-92:
    runs-on: ubuntu-latest
    container:
      image: makedie/fnos:kernHead-6.6.38-trim-92
      options: -v ${{ github.workspace }}:${{ github.workspace }}
    env:
      kernel_name: "6.6.38-trim_92"
      kernel_ver: "6.6.38-trim"
    steps:
      - name: Check out repository code
        run: |
          git clone https://github.com/GreenDamTan/i915-sriov-dkms.git
          cd i915-sriov-dkms && git reset --hard e26ce8952e465762fc0743731aa377ec0b2889ff
      - name: build ko
        run: |
          sed "s/.require_force_probe = 1,/.require_force_probe = 0,/g" -i i915-sriov-dkms/drivers/gpu/drm/i915/i915_pci.c
          sed "s/max_vfs, 0/max_vfs, 7/g" -i i915-sriov-dkms/drivers/gpu/drm/i915/i915_params.h
          dkms add ./i915-sriov-dkms
          dkms install i915-sriov-dkms/2024.09.21 --verbose
      - name: copy ko
        run: |
          mkdir -p upload/${{ inputs.proj_name }}_${{ env.kernel_name }}
          cp -rf /lib/modules/${{ env.kernel_ver }}/updates/dkms/* upload/${{ inputs.proj_name }}_${{ env.kernel_name }}/
      - name: upload ko
        uses: actions/upload-artifact@master
        with:
          name: ${{ inputs.proj_name }}-${{ env.kernel_name }}
          path: upload
