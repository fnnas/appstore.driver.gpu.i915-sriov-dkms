name: get_firmware.yml
permissions:
  contents: write  # Allow writing to repository contents (for pushing tags)
  actions: write   # Allows triggering actions

on:
  workflow_call:  # This allows this workflow to be called from another workflow
    inputs:
      proj_name:
        required: true
        type: string
        default: "i915-sriov-dkms"
      linux_firmware_commit_sha:
        required: true
        type: string
        default: "HEAD"
jobs:
  get_firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Restore i915 firmware cache
        id: cache_firmware
        uses: actions/cache@v5
        with:
          path: linux-firmware/i915
          key: linux-firmware-i915-v1-${{ runner.os }}-${{ inputs.linux_firmware_commit_sha }}
      - name: Fetch i915 firmware
        if: ${{ steps.cache_firmware.outputs.cache-hit != 'true' }}
        shell: bash
        env:
          LINUX_FIRMWARE_COMMIT: ${{ inputs.linux_firmware_commit_sha }}
        run: |
          set -euo pipefail

          source_checkout="$(mktemp -d)"
          trap 'rm -rf -- "$source_checkout"' EXIT

          git clone --quiet --filter=blob:none --no-checkout --single-branch \
            https://gitlab.com/kernel-firmware/linux-firmware.git "$source_checkout"
          git -C "$source_checkout" sparse-checkout init --cone
          git -C "$source_checkout" sparse-checkout set i915
          git -C "$source_checkout" checkout --detach "$LINUX_FIRMWARE_COMMIT"

          mkdir -p linux-firmware
          mv "$source_checkout/i915" linux-firmware/i915
      - name: ls -la
        run: |
          ls -la linux-firmware/i915/
      - name: md5sum
        run: |
          md5sum linux-firmware/i915/*
      - name: upload firmware
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.proj_name }}-${{ inputs.linux_firmware_commit_sha }}-firmware
          path: linux-firmware/i915
