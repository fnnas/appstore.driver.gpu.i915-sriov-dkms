name: Test Release
run-name: ${{ github.actor }} build ${{ github.ref_name }} ${{ github.sha }}

permissions:
  contents: write
  actions: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
    inputs:
      make_release:
        description: 'Do you want to create a release?'
        required: true
        type: boolean
        default: false

env:
  proj_name: "i915-sriov-dkms"
  target_dkms_version: "2026.05.06"
  target_commit_sha: "d146e98a" #2026.05.06
  linux_firmware_commit_sha: "a3d046ca8eee45ff2d2eda129b495c686dd78040" #i915: Xe3LPD DMC v2.34
  this_pack_version: "1.0.12"
jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      proj_name: ${{ env.proj_name }}
      target_commit_sha: ${{ env.target_commit_sha }}
      target_dkms_version: ${{ env.target_dkms_version }}
      linux_firmware_commit_sha: ${{ env.linux_firmware_commit_sha }}
    steps:
      - run: echo "All set!"
  get_firmware:
    uses: ./.github/workflows/get_firmware.yml
    secrets: inherit
    needs:
      - setup
    with:
      proj_name: ${{ needs.setup.outputs.proj_name }}
      linux_firmware_commit_sha: ${{ needs.setup.outputs.linux_firmware_commit_sha }}
  build_6-6-38-trim-92:
    uses: ./.github/workflows/kernel-6.6.38-trim-92.yml
    secrets: inherit
    needs:
      - setup
    with:
      proj_name: ${{ needs.setup.outputs.proj_name }}
      target_commit_sha: ${{ needs.setup.outputs.target_commit_sha }}
      target_dkms_version: ${{ needs.setup.outputs.target_dkms_version }}
  build_6-12-5-trim-10:
    uses: ./.github/workflows/kernel-6.12.5-trim-10.yml
    secrets: inherit
    needs:
      - setup
    with:
      proj_name: ${{ needs.setup.outputs.proj_name }}
      target_commit_sha: "d1a9f212a2f517bdffe4a850f5cbdd0930be17a8" #master-2026.03.05-modify
      target_dkms_version: "2026.03.05"
  build_6-12-18-trim-3:
    uses: ./.github/workflows/kernel-6.12.18-trim-3.yml
    secrets: inherit
    needs:
      - setup
    with:
      proj_name: ${{ needs.setup.outputs.proj_name }}
      target_commit_sha: "d1a9f212a2f517bdffe4a850f5cbdd0930be17a8" #master-2026.03.05-modify
      target_dkms_version: "2026.03.05"
  build_6-18-6-trim-297-amd64:
    uses: ./.github/workflows/kernel-6.18.6-trim-297-amd64.yml
    secrets: inherit
    needs:
      - setup
    with:
      proj_name: ${{ needs.setup.outputs.proj_name }}
      target_commit_sha: ${{ needs.setup.outputs.target_commit_sha }}
      target_dkms_version: ${{ needs.setup.outputs.target_dkms_version }}
  build_6-18-18-trim-427-amd64:
    uses: ./.github/workflows/kernel-6.18.18-trim-427-amd64.yml
    secrets: inherit
    needs:
      - setup
    with:
      proj_name: ${{ needs.setup.outputs.proj_name }}
      target_commit_sha: ${{ needs.setup.outputs.target_commit_sha }}
      target_dkms_version: ${{ needs.setup.outputs.target_dkms_version }}
  build_6-18-18-trim-570-amd64:
    uses: ./.github/workflows/kernel-6.18.18-trim-570-amd64.yml
    secrets: inherit
    needs:
      - setup
    with:
      proj_name: ${{ needs.setup.outputs.proj_name }}
      target_commit_sha: ${{ needs.setup.outputs.target_commit_sha }}
      target_dkms_version: ${{ needs.setup.outputs.target_dkms_version }}
  build_6-18-18-trim-587-amd64:
    uses: ./.github/workflows/kernel-6.18.18-trim-587-amd64.yml
    secrets: inherit
    needs:
      - setup
    with:
      proj_name: ${{ needs.setup.outputs.proj_name }}
      target_commit_sha: ${{ needs.setup.outputs.target_commit_sha }}
      target_dkms_version: ${{ needs.setup.outputs.target_dkms_version }}

  pack_app_tgz:
    needs:
      - get_firmware
      - build_6-6-38-trim-92
      - build_6-12-5-trim-10
      - build_6-12-18-trim-3
      - build_6-18-6-trim-297-amd64
      - build_6-18-18-trim-427-amd64
      - build_6-18-18-trim-570-amd64
      - build_6-18-18-trim-587-amd64
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: restore firmware
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.proj_name }}-${{ env.linux_firmware_commit_sha }}-firmware
          path: app/app/firmware
      - name: restore 6-6-38-trim-92
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.proj_name }}-6.6.38-trim_92
          path: app/app/
      - name: restore 6-12-5-trim-10
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.proj_name }}-6.12.5-trim_10
          path: app/app/
      - name: restore 6-12-18-trim-3
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.proj_name }}-6.12.18-trim_3
          path: app/app/
      - name: restore 6.18.6-trim-297-amd64
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.proj_name }}-6.18.6-trim-297-amd64
          path: app/app/
      - name: restore 6.18.18-trim-427-amd64
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.proj_name }}-6.18.18-trim-427-amd64
          path: app/app/
      - name: restore 6.18.18-trim-570-amd64
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.proj_name }}-6.18.18-trim-570-amd64
          path: app/app/
      - name: restore 6.18.18-trim-587-amd64
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.proj_name }}-6.18.18-trim-587-amd64
          path: app/app/

      - name: 打包app.tgz
        run: |
          cd app/
          tar zcvf app.tgz app ui
          mv app.tgz ../i915-sriov-dkms_driver/
      - name: 打包package
        run: |
          tar zcvf appstore.driver.gpu.i915-sriov-dkms-${{ env.this_pack_version }}-${{ env.target_commit_sha }}.tgz i915-sriov-dkms_driver
      - name: 上传应用包
        uses: actions/upload-artifact@master
        with:
          name: appstore.driver.gpu.i915-sriov-dkms-${{ env.this_pack_version }}-${{ env.target_commit_sha }}.tgz
          path: appstore.driver.gpu.i915-sriov-dkms-${{ env.this_pack_version }}-${{ env.target_commit_sha }}.tgz
      - name: Create GitHub Release
        if: ${{ inputs.make_release }}
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.this_pack_version }}
          prerelease: true
          release_name: "fnnas.appstore.driver.gpu.i915-sriov-dkms-${{ env.this_pack_version }}-${{ env.target_commit_sha }}"

      - name: Upload Release Assets
        if: ${{ inputs.make_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Uploading release assets..."
          
          echo "Uploading appstore.driver.gpu.i915-sriov-dkms-${{ env.this_pack_version }}-${{ env.target_commit_sha }}.tgz"
          gh release upload "${{ env.this_pack_version }}" "appstore.driver.gpu.i915-sriov-dkms-${{ env.this_pack_version }}-${{ env.target_commit_sha }}.tgz" || echo "Failed to upload $file"
          
          echo "Upload completed!"

      - name: Verify Uploaded Assets
        if: ${{ inputs.make_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Uploaded assets:"
          gh release view "${{ env.this_pack_version }}" --json assets -q '.assets[].name'
